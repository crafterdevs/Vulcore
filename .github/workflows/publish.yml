name: Publish to NuGet

on:
  push:
    # tags:
    #   - 'v*.*.*'
    branches:
      - main 

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore ./VulCore/VulCore/VulCore.csproj

    - name: Build
      run: dotnet build  ./VulCore/VulCore/VulCore.csproj --configuration Release --no-restore

    - name: Pack
      run: dotnet pack ./VulCore/VulCore/VulCore.csproj  --configuration Release --no-build -o ./nupkg

    - name: Publish to NuGet
      run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json